<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-labelledby="t d">
  <title id="t">FogAI decision flow</title>
  <desc id="d">Sensor readings enter the fog node. Features are normalised, hard safety rules R1 to R5 are checked first, a weighted risk score is computed, and if no hard rule fired, score-based routing rules SR1 to SR4 choose the destination. The result is a local action plus routing to fog only, cloud only, or both. The cloud receives telemetry for readings routed to cloud or both.</desc>
  <rect width="1240" height="470" rx="14" fill="#0b1118"/>
  <rect x="0.5" y="0.5" width="1239" height="469" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><text x="36" y="44" font-size="13" letter-spacing="3" fill="#22d3ee" font-weight="600">FOG NODE: ONE PROCESSING CYCLE</text></g>
  <rect x="36" y="80" width="170" height="150" rx="10" fill="#111a22" stroke="#4ade80" stroke-width="1.8"/>
  <text x="52" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">IoT sensors</text>
  <text x="52" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Temperature</text>
  <text x="52" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">CPU load</text>
  <text x="52" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Vibration</text>
  <text x="52" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Network latency</text>
  <text x="52" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Humidity, power</text>
  <line x1="206" y1="155.0" x2="236" y2="155.0" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M229 150.0 L236 155.0 L229 160.0" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="238" y="80" width="190" height="150" rx="10" fill="#111a22" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="254" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Feature extraction</text>
  <text x="254" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Normalise to 0..1</text>
  <text x="254" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">temp: 20 to 90 C</text>
  <text x="254" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">cpu: 0 to 100 %</text>
  <text x="254" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">vibration: 0 to 4 g</text>
  <text x="254" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">network: 0 to 500 ms</text>
  <line x1="428" y1="155.0" x2="458" y2="155.0" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M451 150.0 L458 155.0 L451 160.0" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="80" width="250" height="150" rx="10" fill="#111a22" stroke="#fb7185" stroke-width="1.8"/>
  <text x="476" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Hard safety rules</text>
  <text x="476" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">R1 temp &gt;= 90 C: shutdown</text>
  <text x="476" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">R2 temp &gt;= 75 C: alert</text>
  <text x="476" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">R3 network down: fog only</text>
  <text x="476" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">R4 vibration &gt;= 4 g: shutdown</text>
  <text x="476" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">R5 CPU &gt;= 95 %: throttle</text>
  <line x1="710" y1="155.0" x2="740" y2="155.0" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M733 150.0 L740 155.0 L733 160.0" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="742" y="80" width="220" height="150" rx="10" fill="#111a22" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="758" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Weighted risk score</text>
  <text x="758" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">0.35 temperature</text>
  <text x="758" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">0.25 vibration</text>
  <text x="758" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">0.20 CPU</text>
  <text x="758" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">0.20 network</text>
  <text x="758" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">score in 0..1</text>
  <line x1="962" y1="155.0" x2="992" y2="155.0" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M985 150.0 L992 155.0 L985 160.0" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="994" y="80" width="210" height="150" rx="10" fill="#111a22" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="1010" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Score routing</text>
  <text x="1010" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Only if no hard rule fired</text>
  <text x="1010" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">SR1 network poor: fog</text>
  <text x="1010" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">SR2 risk &lt; 0.35: cloud</text>
  <text x="1010" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">SR3 risk &lt; 0.65: fog</text>
  <text x="1010" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">SR4 otherwise: both + alert</text>
  <line x1="585" y1="230" x2="585" y2="298" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
  <path d="M578 293 L585 298 L578 303" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="577" y="270" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#fb7185">a hard rule fired: it decides</text>
  <path d="M1099 230 V268 H690" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <line x1="690" y1="268" x2="690" y2="298" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M683 293 L690 298 L683 303" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1090" y="270" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#a9bcc4">no hard rule: the score decides</text>
  <rect x="36" y="300" width="330" height="110" rx="10" fill="#111a22" stroke="#4ade80" stroke-width="1.8"/>
  <text x="52" y="328" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Local action (at the fog node)</text>
  <text x="52" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Shutdown, alert, throttle or log</text>
  <text x="52" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Executed with no cloud round trip</text>
  <text x="52" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Written to a local JSONL log</text>
  <rect x="405" y="300" width="390" height="110" rx="10" fill="#111a22" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="421" y="328" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Decision: destination + action + confidence</text>
  <text x="421" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">FOG: process locally    CLOUD: forward telemetry</text>
  <text x="421" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">BOTH: act locally and also log to cloud</text>
  <text x="421" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Each decision lists its triggered rules</text>
  <rect x="834" y="300" width="370" height="110" rx="10" fill="#111a22" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="850" y="328" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#eef6f8">Cloud service (stub)</text>
  <text x="850" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Receives telemetry for CLOUD and BOTH</text>
  <text x="850" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Stores JSONL records locally in this demo</text>
  <text x="850" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a9bcc4">Never in the path of a safety action</text>
  <line x1="405" y1="355" x2="368" y2="355" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M375 350 L368 355 L375 360" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="795" y1="355" x2="832" y2="355" stroke="#5d7480" stroke-width="2" stroke-linecap="round"/>
  <path d="M825 350 L832 355 L825 360" fill="none" stroke="#5d7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1204" y="450" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6f8791">With the network down (R3) routing is forced to fog only; the engine keeps deciding with no cloud.</text>
</svg>
