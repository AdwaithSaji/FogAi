<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">FogAI</title>
  <desc id="d">FogAI: IoT sensors feed a fog node that decides locally in a few milliseconds, while the cloud round trip takes about 120 milliseconds in the simulation model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1620"/><stop offset="1" stop-color="#070b10"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="104" font-size="15" letter-spacing="4" fill="#22d3ee" font-weight="600">LOW-LATENCY INTELLIGENT IOT</text>
    <text x="72" y="190" font-size="92" letter-spacing="6" fill="#eef6f8" font-weight="700">FOGAI</text>
    <text x="74" y="234" font-size="23" fill="#8aa0aa">Decisions at the fog layer, not a cloud round trip.</text>
    <g font-size="14" fill="#c5d3d8">
      <rect x="72" y="262" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="120" y="282" text-anchor="middle">Python</text>
      <rect x="178" y="262" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="253" y="282" text-anchor="middle">Fog computing</text>
      <rect x="338" y="262" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="402" y="282" text-anchor="middle">Simulation</text>
    </g>
  </g>
  <g transform="translate(640 0)">
    <circle cx="250" cy="170" r="90" fill="url(#glow)"/>
    <g fill="#0c1620" stroke="#4ade80" stroke-width="2.5">
      <circle cx="30" cy="130" r="9"/><circle cx="30" cy="170" r="9"/><circle cx="30" cy="210" r="9"/>
    </g>
    <g stroke="#22d3ee" stroke-width="2" stroke-opacity="0.8">
      <line x1="40" y1="130" x2="200" y2="162"/><line x1="40" y1="170" x2="200" y2="170"/><line x1="40" y1="210" x2="200" y2="178"/>
    </g>
    <rect x="205" y="140" width="90" height="60" rx="12" fill="#0b2230" stroke="#22d3ee" stroke-width="3"/>
    <text x="250" y="176" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#22d3ee" letter-spacing="2">FOG</text>
    <line x1="300" y1="160" x2="470" y2="96" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
    <rect x="470" y="66" width="86" height="56" rx="12" fill="#0c1a2a" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.75"/>
    <text x="513" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#60a5fa" letter-spacing="2">CLOUD</text>
    <line x1="300" y1="182" x2="470" y2="236" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="470" y="208" width="86" height="56" rx="12" fill="#0c2018" stroke="#4ade80" stroke-width="2.5"/>
    <text x="513" y="233" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1">LOCAL</text>
    <text x="513" y="251" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#4ade80" letter-spacing="1">ACTION</text>
    <g font-size="14" fill="#a9bcc4">
      <text x="30" y="250" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">sensors</text>
      <text x="372" y="98" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#60a5fa">~120 ms</text>
      <text x="372" y="252" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" fill="#4ade80">~3 ms</text>
    </g>
    <text x="300" y="300" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6f8791" letter-spacing="1">LATENCIES FROM THE SIMULATION MODEL</text>
  </g>
</svg>
